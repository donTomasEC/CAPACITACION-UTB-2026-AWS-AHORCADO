version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Instalando dependencias..."
      - npm ci

  build:
    commands:
      - echo "Construyendo aplicación React..."
      - npm run build
      - ls -la dist
      - test -f dist/index.html

  post_build:
    commands:
      - echo "Build finalizado correctamente"

artifacts:
  files:
    - dist/**/*
    - server.cjs
    - package.json
    - package-lock.json
    #- package.json
    #- package-lock.json
    #- server.js        # archivo de entrada
    #- src/**/*         # codigo
    #- Procfile
  
  base-directory: dist